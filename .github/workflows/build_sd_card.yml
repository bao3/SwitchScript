# Nintendo Switch SD Card Automated Builder

on:
  schedule:
    # 每天北京时间凌晨 01:13（UTC 前一天 17:13）
    - cron: '13 17 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-nro:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v5

      - name: Build PackUpdater.nro
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src/pack-updater \
            devkitpro/devkita64:latest \
            bash -lc 'source /opt/devkitpro/switchvars.sh && make -j"$(nproc)"'
          test -f pack-updater/PackUpdater.nro

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: pack-updater-nro
          path: pack-updater/PackUpdater.nro
          if-no-files-found: error

  build-sd-layout:
    needs: build-nro
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Download PackUpdater.nro
        uses: actions/download-artifact@v4
        with:
          name: pack-updater-nro
          path: dist-nro

      - name: Initialize Environment Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq unzip curl zip

      - name: Fetch Atmosphere Version Tag
        id: ams_env
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AMS_TAG=$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "User-Agent: bao3-SwitchScript" \
            https://api.github.com/repos/Atmosphere-NX/Atmosphere/releases/latest | jq -r '.tag_name')
          if [ -z "$AMS_TAG" ] || [ "$AMS_TAG" = "null" ]; then
            AMS_TAG=$(date +'%Y%m%d')
          fi
          echo "version=${AMS_TAG}" >> "$GITHUB_OUTPUT"
          echo "==> Atmosphere version: ${AMS_TAG}"

      - name: Execute Core Switch Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./switchScript.sh
          ./switchScript.sh
          test -f "./NS SD Card/atmosphere/package3"

      - name: Install PackUpdater into layout
        run: |
          mkdir -p "./NS SD Card/switch/PackUpdater"
          cp dist-nro/PackUpdater.nro "./NS SD Card/switch/PackUpdater/PackUpdater.nro"
          cp pack-updater/config.ini.example "./NS SD Card/switch/PackUpdater/config.ini"
          printf '%s\n' "${{ steps.ams_env.outputs.version }}" > "./NS SD Card/switch/PackUpdater/installed.txt"

      - name: Compress SD Card Folder
        run: |
          VER="${{ steps.ams_env.outputs.version }}"
          cd "./NS SD Card"
          zip -r "../NS-SD-Card-Atmosphere-${VER}.zip" ./*
          cd ..
          SIZE=$(stat -c%s "NS-SD-Card-Atmosphere-${VER}.zip")
          echo "==> zip bytes: ${SIZE}"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "Refusing to publish zip smaller than 10MB (got ${SIZE})"
            exit 1
          fi

      - name: Update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: |
            NS-SD-Card-Atmosphere-${{ steps.ams_env.outputs.version }}.zip
            dist-nro/PackUpdater.nro
          tag: "${{ steps.ams_env.outputs.version }}"
          name: "Nintendo Switch SD Card Build - Atmosphere ${{ steps.ams_env.outputs.version }}"
          body: |
            Automated SD pack (Atmosphere ${{ steps.ams_env.outputs.version }}).
            On-device updater: hbmenu -> PackUpdater, or copy PackUpdater.nro to sdmc:/switch/PackUpdater/.
          allowUpdates: true
          removeArtifacts: false
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Automated Keep-Alive Self-Commit
        run: |
          date -u +"%Y-%m-%d %H:%M:%S UTC" > .github/workflow_keep_alive.txt
          if ! git diff --exit-code .github/workflow_keep_alive.txt; then
            echo "==> Detection: Repository freeze detected. Initiating keep-alive deployment..."
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git add .github/workflow_keep_alive.txt
            git commit -m "chore: workflow auto-maintenance heartbeat [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
            echo "==> Success: Heartbeat pushed successfully. Action cooling-off period refreshed."
          else
            echo "==> Notice: No modification tracked. Skipping keep-alive execution."
          fi
